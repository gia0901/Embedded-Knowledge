apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-egress, namespace: web}
spec:
  podSelector: {}
  policyTypes: [Egress]
---
# web-egress-allow.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: frontend-egress, namespace: web}
spec:
  podSelector: {matchLabels: {app: frontend}}
  policyTypes: [Egress]
  egress:
  - to:                                               # DNS
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
      podSelector: {matchLabels: {k8s-app: kube-dns}}
    ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
  - to:                                               # chỉ được gọi auth
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: security}}
      podSelector: {matchLabels: {app: auth}}
    ports: [{protocol: TCP, port: 8443}]
