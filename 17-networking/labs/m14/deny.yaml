apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-ingress, namespace: security}
spec:
  podSelector: {}                    # mọi pod trong namespace
  policyTypes: [Ingress]             # không có rule ingress → chặn hết
---
# allow-and.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: auth-from-frontend, namespace: security}
spec:
  podSelector: {matchLabels: {app: auth}}
  policyTypes: [Ingress]
  ingress:
  - from:
    - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: web}}
      podSelector: {matchLabels: {app: frontend}}      # cùng phần tử với dòng trên → AND
    ports: [{protocol: TCP, port: 8443}]
