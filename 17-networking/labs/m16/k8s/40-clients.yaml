apiVersion: v1
kind: Pod
metadata: {name: frontend, namespace: web, labels: {app: frontend}}
spec:
  serviceAccountName: frontend
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
  containers:
  - name: c
    image: nicolaka/netshoot:v0.13
    command: ["sleep", "infinity"]
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
    volumeMounts:
    - {name: tls, mountPath: /tls, readOnly: true}
    - {name: trust, mountPath: /trust, readOnly: true}
  volumes:
  - {name: tls, secret: {secretName: frontend-tls}}
  - {name: trust, configMap: {name: netlab-root}}
---
apiVersion: v1
kind: Pod
metadata: {name: reporter, namespace: batch, labels: {app: reporter}}
spec:
  serviceAccountName: reporter
  automountServiceAccountToken: false
  securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
  containers:
  - name: c
    image: nicolaka/netshoot:v0.13
    command: ["sleep", "infinity"]
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
    volumeMounts:
    - {name: tls, mountPath: /tls, readOnly: true}
    - {name: trust, mountPath: /trust, readOnly: true}
  volumes:
  - {name: tls, secret: {secretName: reporter-tls}}
  - {name: trust, configMap: {name: netlab-root}}
---
apiVersion: v1
kind: Pod
metadata: {name: attacker, namespace: default, labels: {app: attacker}}
spec:
  containers:
  - {name: c, image: "nicolaka/netshoot:v0.13", command: ["sleep", "infinity"]}
