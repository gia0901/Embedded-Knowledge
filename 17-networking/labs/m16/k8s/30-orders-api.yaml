apiVersion: apps/v1
kind: Deployment
metadata: {name: orders-api, namespace: apps}
spec:
  replicas: 2
  selector: {matchLabels: {app: orders-api}}
  template:
    metadata: {labels: {app: orders-api}}
    spec:
      serviceAccountName: orders-api
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: app
        image: netlab/auth:1.0
        imagePullPolicy: Never
        command: ["python3", "orders_api.py"]
        ports: [{containerPort: 8443}]
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        volumeMounts:
        - {name: tls, mountPath: /tls, readOnly: true}
        - {name: trust, mountPath: /trust, readOnly: true}
      volumes:
      - {name: tls, secret: {secretName: orders-api-tls}}
      - {name: trust, configMap: {name: netlab-root}}
---
apiVersion: v1
kind: Service
metadata: {name: orders, namespace: apps}
spec:
  selector: {app: orders-api}
  ports: [{port: 8443, targetPort: 8443}]
